<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Training</title>
  <meta name="description" content="Personal training, group classes and online coaching">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top wrap">
    <a href="#" class="brand" id="brand"></a>
    <nav id="nav"></nav>
  </header>

  <main>
    <section id="hero" class="hero wrap">
      <h1 id="tagline"></h1>
      <p class="lead" id="intro"></p>
      <a class="btn" id="cta" href="#contact"></a>
    </section>

    <section id="programs" class="wrap"><h2>Programs</h2><div id="programs-list"></div></section>
    <section id="sessions" class="wrap"><h2>Upcoming sessions</h2><div id="sessions-list"></div></section>
    <section id="about" class="wrap"><h2 id="about-heading"></h2><div id="about-text"></div></section>
    <section id="testimonials" class="wrap"><h2>What clients say</h2><div id="testimonials-list"></div></section>
    <section id="faq" class="wrap"><h2>Questions</h2><div id="faq-list"></div></section>
    <section id="contact" class="wrap"><h2>Get in touch</h2><div id="contact-body"></div></section>
  </main>

  <footer class="wrap"><small id="footer"></small></footer>

  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
